# Application Name
spring.application.name=foodflow-backend

# Server Configuration
server.port=${PORT:8080}

spring.config.import=optional:file:./.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Python AI Service Configuration (FastAPI)
foodflow.ai.base-url=${AI_BASE_URL:http://localhost:8000}
foodflow.ai.connect-timeout-seconds=10
foodflow.ai.read-timeout-seconds=180

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# SpringDoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Razorpay Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_mock_key}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:mock_secret_key}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
foodflow.rabbitmq.exchange=foodflow.exchange

# Redis / Cache Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=${SPRING_CACHE_TYPE:redis}
